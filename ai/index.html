<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-font="sans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>aiweb</title>
<link id="hlTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="tbtn mob-only" id="btnLeft" title="侧栏">☰</button>
    <div class="brand"><span class="logo">◈</span>aiweb</div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnWorkbench" title="工作台 (Ctrl+J)">🗂 <span class="lbl" id="wbLabel">项目</span></button>
    <button class="tbtn" id="btnSearch" title="搜索 (Ctrl+K)">🔍</button>
    <button class="tbtn" id="btnTheme" title="主题">🌙</button>
    <button class="tbtn" id="btnSettings" title="设置">⚙️</button>
  </header>

  <div class="main">

    <aside class="pane" id="left">
      <div class="rail">
        <button class="rail-btn" id="btnCollapseL" title="折叠 / 展开">☰</button>
        <button class="rail-btn" id="btnNewChatRail" title="新对话">＋</button>
        <button class="rail-btn on" data-rail="sessions" title="会话">💬</button>
        <button class="rail-btn" data-rail="skills" title="技能">🎯</button>
        <button class="rail-btn" data-rail="outputs" title="产出">📦</button>
        <span class="spacer"></span>
        <button class="rail-btn" id="btnSettingsRail" title="设置">⚙️</button>
      </div>
      <div class="left-main">
      <div class="seg2">
        <button class="tab on" data-tab="sessions">会话</button>
        <button class="tab" data-tab="skills">技能</button>
        <button class="tab" data-tab="outputs">产出</button>
      </div>
      <div class="pane-body" id="tabSessions">
        <div class="srch row">
          <button class="btn pri sm" id="btnNewChat">新建对话</button>
          <input id="sessSearch" placeholder="搜索会话">
        </div>
        <div id="sessList"></div>
      </div>
      <div class="pane-body" id="tabSkills" style="display:none">
        <div class="srch"><input id="skillSearch" placeholder="搜索技能"></div>
        <div class="cmdbar cats" id="skillCats"></div>
        <div class="skills" id="skillGrid"></div>
      </div>
      <div class="pane-body" id="tabOutputs" style="display:none"><div id="outList"></div></div>
      <div class="foot">
        <span class="pill" id="skillFootPill"></span>
        <span class="spacer"></span>
        <button class="btn sm" id="btnCustomSkill">+ 技能</button>
        <button class="btn sm" id="btnSkillExport">导出</button>
        <button class="btn sm" id="btnSkillImport">导入</button>
        <input type="file" id="skillFile" accept=".json,application/json" hidden>
      </div>
      </div>
    </aside>

    <section class="pane" id="center">
      <div class="pane-head">
        <span class="ttl" id="curTitle">新对话</span>
        <span class="pill" id="curSkillPill"></span>
        <span class="spacer"></span>
        <button class="mini" id="sessExportMd">导出 .md</button>
      </div>
      <div id="chat"></div>
      <div class="composer">
        <div class="wrap">
          <div class="cmdbar" id="cmdbar"></div>
          <div class="attachbar" id="attachBar"></div>
          <div class="inputrow">
            <button class="file-btn" id="btnAttach" title="上传文本文件">📎</button>
            <input type="file" id="filePicker" hidden multiple
              accept=".txt,.md,.markdown,.js,.mjs,.json,.html,.htm,.css,.csv">
            <textarea id="input" rows="1" placeholder="输入需求，或 /project /doc /ppt /ppt-anim /style /code /debug /search"></textarea>
            <button class="send" id="send">↑</button>
          </div>
          <div class="meta">
            <span id="mTok">≈ 0 tokens</span><span class="dot"></span>
            <span id="mStat"></span>
            <span class="spacer"></span>
            <span id="mModel"></span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<aside id="right" class="workbench">
  <div class="wb-head">
    <div class="seg">
      <button class="segbtn on" data-wb="project">项目</button>
      <button class="segbtn" data-wb="doc">文档</button>
      <button class="segbtn" data-wb="ppt">PPT</button>
      <button class="segbtn" data-wb="preview">预览</button>
    </div>
    <span class="spacer"></span>
    <button class="xbtn" id="btnWbClose">✕</button>
  </div>
  <div class="wb-body">

    <section class="wb-pane" id="wbProject">
      <div class="wb-bar">
        <button class="btn sm pri" id="btnZipTop">打包下载 ZIP</button>
        <button class="btn sm" id="btnPreviewTop">预览项目</button>
        <span class="pill" id="projPill"></span>
      </div>
      <div class="wb-error" id="wbError" style="display:none">
        <div class="we-main">
          <div class="we-t" id="wbErrMsg">解析失败，请尝试重新生成或减少项目规模</div>
          <div class="we-acts">
            <button class="btn sm pri" id="btnRetry">重试</button>
            <button class="btn sm" id="btnWbRetry2">减少规模重试</button>
          </div>
        </div>
      </div>
      <div class="wb-split">
        <div class="wb-tree"><div id="tree"></div></div>
        <div class="wb-code">
          <div class="bar">
            <span class="path" id="codeName"></span>
            <button class="mini" id="btnCodeMode">编辑</button>
            <button class="mini" id="btnFileDl">单文件</button>
          </div>
          <pre class="hlcode" id="codeHl"><code></code></pre>
          <textarea id="codeArea" spellcheck="false" style="display:none" placeholder="选择左侧文件"></textarea>
        </div>
      </div>
    </section>

    <section class="wb-pane" id="wbDoc" style="display:none">
      <div class="wb-bar">
        <button class="btn sm pri" data-docdl="docx">导出 .docx</button>
        <button class="btn sm" id="btnDownloadMd">导出 .md</button>
        <button class="btn sm" data-docdl="doc">导出 .doc</button>
        <button class="btn sm" data-docdl="html">.html</button>
        <button class="btn sm" id="btnCopyMd">复制</button>
        <button class="btn sm" id="btnDocSaveArt">存入产出</button>
        <span class="pill doc-title-pill" id="docTitle"></span>
      </div>
      <div class="wb-scroll"><div class="md" id="docPreview"></div></div>
    </section>

    <section class="wb-pane" id="wbPpt" style="display:none">
      <div class="wb-bar">
        <button class="btn sm pri" id="pptExportBtn">导出 .pptx</button>
        <button class="btn sm" id="pptCopyBtn">复制大纲</button>
        <span class="pill" id="pptPill"></span>
      </div>
      <div class="wb-scroll" id="pptOutline"></div>
    </section>

    <section class="wb-pane" id="wbPreview" style="display:none">
      <div class="wb-bar">
        <button class="btn sm" id="btnReloadPrev">重新加载</button>
        <button class="btn sm" id="btnOpenNew">新窗口打开</button>
      </div>
      <div class="wb-frame">
        <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
      </div>
    </section>

    <div class="wb-loading" id="wbLoading" style="display:none">
      <div class="spinner"></div>
      <div class="wl-t">正在生成…</div>
      <div class="wl-s">完成后自动呈现</div>
    </div>
  </div>
</aside>

<div id="toasts"></div>

<div class="mask" id="mSettings">
  <div class="modal">
    <div class="modal-head"><span class="mh-t">设置</span><span class="spacer"></span><button class="xbtn" data-close="mSettings">✕</button></div>
    <div class="modal-body">
      <div class="sect">接口</div>
      <div class="grid2">
        <div class="field"><label>Base URL</label><input id="stBase" placeholder="https://api.deepseek.com"></div>
        <div class="field"><label>模型</label><input id="stModel" placeholder="deepseek-chat"></div>
      </div>
      <div class="field"><label>API Key</label><input id="stKey" type="password" placeholder="sk-…" autocomplete="off"></div>
      <div class="row gap">
        <button class="btn sm" id="stKeyClear">清空 Key</button>
        <label class="switch inline"><input type="checkbox" id="stNoKey">本次会话不保存 Key</label>
      </div>
      <div class="field" style="margin-top:12px"><label>代理 URL（CORS 失败时填）</label>
        <input id="stProxy" placeholder="https://api.allorigins.win/raw?url={url}"></div>

      <div class="sect">生成参数</div>
      <div class="grid3">
        <div class="field"><label>temperature</label><input id="stTemp" type="number" step="0.1" min="0" max="2"></div>
        <div class="field"><label>max_tokens</label><input id="stMax" type="number" min="256" step="1000"></div>
        <div class="field"><label>上下文条数</label><input id="stCtx" type="number" min="2" max="60"></div>
        <div class="field"><label>总超时（ms）</label><input id="stTimeout" type="number" min="5000" step="10000"></div>
        <div class="field"><label>断流中断（秒）</label><input id="stStall" type="number" min="10" max="600" step="10"></div>
        <div class="field"><label>重试次数</label><input id="stRetry" type="number" min="0" max="5"></div>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div class="field"><label>主题</label><select id="stTheme"><option value="dark">深色</option><option value="light">浅色</option></select></div>
        <div class="field"><label>字体</label><select id="stFont"><option value="sans">无衬线</option><option value="serif">衬线</option><option value="mono">等宽</option></select></div>
      </div>
      <label class="switch"><input type="checkbox" id="stStream">流式输出</label>
      <label class="switch"><input type="checkbox" id="stThink">过滤思考过程</label>
      <label class="switch"><input type="checkbox" id="stAutoSave">生成后直接下载文件</label>

      <div class="sect">系统提示词</div>
      <div class="field"><textarea id="stSys" rows="6"></textarea></div>

      <div class="sect">联网搜索</div>
      <div class="field"><label>方式</label><select id="stWebP">
        <option value="browser">系统浏览器（免 Key）</option>
        <option value="wiki">维基百科（免 Key）</option>
        <option value="ddg">DuckDuckGo（免 Key · 需代理）</option>
        <option value="tavily">Tavily（需 Key）</option>
        <option value="serper">Serper（需 Key）</option>
        <option value="bing">Bing（需 Key）</option>
      </select></div>
      <div class="grid2">
        <div class="field"><label>浏览器引擎</label><select id="stEngine">
          <option value="bing">Bing</option><option value="google">Google</option>
          <option value="baidu">百度</option><option value="ddg">DuckDuckGo</option></select></div>
        <div class="field"><label>搜索 API Key</label><input id="stWebK" type="password" placeholder="可留空"></div>
      </div>

      <div class="sect">数据</div>
      <div class="row gap">
        <button class="btn" id="stExport">导出全部</button>
        <button class="btn" id="stImport">导入</button>
        <button class="btn danger" id="stClear">清空全部</button>
        <input type="file" id="stFile" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="modal-foot"><button class="btn pri" id="stSave">保存</button></div>
  </div>
</div>

<div class="mask" id="mSearch">
  <div class="modal narrow">
    <div class="modal-head srchhead">
      <input id="searchInput" placeholder="搜索会话、技能、产出" autocomplete="off">
      <button class="xbtn" data-close="mSearch">✕</button>
    </div>
    <div class="modal-body" id="searchResults"></div>
  </div>
</div>

<div class="mask" id="mSkill">
  <div class="modal narrow">
    <div class="modal-head"><span class="mh-t">自定义技能</span><span class="spacer"></span><button class="xbtn" data-close="mSkill">✕</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><label>名称</label><input id="skName" placeholder="例如：Unity 脚本生成"></div>
        <div class="field"><label>图标</label><input id="skIcon" value="🧩"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>分类</label><select id="skCat">
          <option>编程</option><option>写作</option><option>设计</option><option>办公</option></select></div>
        <div class="field"><label>输出格式</label><select id="skFmt">
          <option value="code">code</option><option value="markdown">markdown</option>
          <option value="json">json</option><option value="text">text</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>快捷指令</label><input id="skCmd" placeholder="/unity"></div>
        <div class="field"><label>需求短语示例</label><input id="skHint" placeholder="做一个 2D 平台跳跃控制"></div>
      </div>
      <div class="field"><label>System Prompt</label><textarea id="skPrompt" rows="6"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="mSkill">取消</button>
      <button class="btn pri" id="skSave">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="mPpt">
  <div class="modal narrow">
    <div class="modal-head"><span class="mh-t">生成 PPT</span><span class="spacer"></span><button class="xbtn" data-close="mPpt">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>主题</label>
        <input id="pptTopic" placeholder="请输入PPT主题" autocomplete="off"></div>
      <div class="grid2">
        <div class="field"><label>页数</label><select id="pptPages">
          <option>5</option><option selected>8</option><option>10</option><option>12</option><option>15</option></select></div>
        <div class="field"><label>风格</label><select id="pptStyle">
          <option>学术严谨</option><option>商务简洁</option><option>活泼科普</option><option>极简黑白</option></select></div>
      </div>
      <div class="hint">切换与动画请用 /ppt-anim。</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="mPpt">取消</button>
      <button class="btn pri" id="pptGo">开始生成</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="js/skills.js"></script>
<script src="js/api.js"></script>
<script src="js/project.js"></script>
<script src="js/app.js"></script>
</body>
</html>
