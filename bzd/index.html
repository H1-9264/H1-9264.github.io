<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BZD CubeTimer</title>
    <meta name="description" content="深色简约、高度自定义、多平台的魔方计时器" />
    <style>
      /* 启动失败兜底：白屏时必须能看到原因，而不是只剩标题 */
      #boot-error {
        margin: 0;
        padding: 20px;
        background: #1a0f12;
        color: #ffb4b4;
        font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        border-bottom: 1px solid #5a2a2a;
      }
      #boot-hint {
        padding: 24px;
        color: #8c9bac;
        font: 13px/1.8 system-ui, sans-serif;
      }
    </style>
    <script defer src="./js/app.js"></script>
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body>
    <div id="boot-error" hidden></div>
    <div id="root"></div>

    <noscript>
      <div id="boot-hint">
        本应用需要 JavaScript 才能运行，请在浏览器设置中启用 JavaScript。
      </div>
    </noscript>

    <script>
      // 兜底：任何脚本加载失败或运行时报错，都直接显示在页面上
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el || !el.hidden) return;
          el.hidden = false;
          el.textContent =
            '启动失败：' +
            msg +
            '\n\n若为资源 404，请确认部署的是构建产物（npm run build:ghpages 生成的 docs/），而不是源码目录。';
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && (t.src || t.href)) show('资源加载失败 ' + (t.src || t.href));
            else show((e && e.message) || '未知脚本错误');
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          show((r && (r.message || r)) || '未处理的 Promise 拒绝');
        });
      })();
    </script>

    <!-- 应用入口（Vite 会在这里注入打包后的资源） -->
  </body>
</html>
