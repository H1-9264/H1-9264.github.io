<meta name="description" content="关于 Buzhidao Math：纯前端数学工作台的项目说明、特性、快捷键、技术栈与联系方式。">
<title>关于 · Buzhidao Math</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script type="module">
  import { apply } from './assets/js/core/theme.js';
  apply();
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="bg-grid" aria-hidden="true"></div>
<header id="site-nav"></header>

<main class="section container">
  <div class="section-head reveal" style="max-width:none">
    <div class="row-between wrap">
      <div>
        <span class="eyebrow">about</span>
        <h1 class="mt-3" data-i18n="nav.about">关于</h1>
        <p class="text-sm text-dim mt-2">
          <span data-i18n="about.source">本页内容来自</span>
          <code class="mono">assets/content/about.md</code>
        </p>
      </div>
      <div class="row-inline">
        <button class="btn btn-sm" id="btnEditMd" data-i18n="about.edit">编辑</button>
        <button class="btn btn-sm" id="btnCopyMd" data-i18n="about.copyMd">复制 Markdown</button>
        <button class="btn btn-sm" id="btnDownloadMd" data-i18n="about.downloadMd">下载 .md</button>
        <a class="btn btn-sm btn-ghost" href="assets/content/about.md" target="_blank" rel="noopener" data-i18n="about.raw">查看源文件</a>
      </div>
    </div>
  </div>

  <article class="card card-pad reveal" id="aboutBody" style="max-width:none"></article>

  <section class="card card-pad mt-4" id="aboutEditor" hidden>
    <div class="row-between mb-3">
      <strong data-i18n="about.editing">编辑 Markdown</strong>
      <div class="row-inline">
        <button class="btn btn-sm btn-primary" id="btnApplyMd" data-i18n="common.apply">应用</button>
        <button class="btn btn-sm" id="btnCancelMd" data-i18n="common.cancel">取消</button>
      </div>
    </div>
    <textarea class="textarea" id="mdInput" rows="18" spellcheck="false" style="min-height:340px"></textarea>
    <p class="text-xs text-dim mt-2" data-i18n="about.editHint">修改只影响当前页面预览；想永久改可以"下载 .md"后替换 assets/content/about.md。</p>
  </section>

  <div class="grid grid-3 mt-5">
    <a class="feature reveal" href="plotter.html">
      <h3 data-i18n="nav.plotter">函数绘图</h3>
      <p data-i18n="home.feature.plotterDesc">多曲线、参数方程、极坐标，缩放平移、求根求交点、定积分与切线，一键导出高清 PNG / SVG。</p>
    </a>
    <a class="feature reveal" href="geometry.html">
      <h3 data-i18n="nav.geometry">几何画板</h3>
      <p data-i18n="home.feature.geometryDesc">点、线、圆、多边形与变换，尺规作图式依赖关系，拖动一点全图联动。</p>
    </a>
    <a class="feature reveal" href="tools.html">
      <h3 data-i18n="nav.tools">实用工具</h3>
      <p data-i18n="home.feature.toolsDesc">导数探索、数据绘图、单位换算、科学计算器、调色板与番茄钟。</p>
    </a>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module" src="assets/js/pages/about.js"></script>
</body>
</html>
