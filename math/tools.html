<title>实用工具 · Buzhidao Math</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script type="module">
  import { apply } from './assets/js/core/theme.js';
  apply();
</script>

<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="bg-grid" aria-hidden="true"></div>
<header id="site-nav"></header>

<main>
  <section class="section" style="padding-top:clamp(24px,4vh,48px)">
    <div class="container">
      <div class="tools-hero-mini">
        <div>
          <span class="eyebrow">toolbox</span>
          <h1 class="mt-3" style="font-size:var(--fs-3xl)" data-i18n="tools.title">实用工具</h1>
          <p class="text-lg text-muted mt-3" data-i18n="tools.subtitle">九个即开即用的小工具，全部在本地浏览器中计算，不上传任何数据。</p>
        </div>
        <button class="btn btn-ghost" id="btnBackTools" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
          <span data-i18n="tools.back">返回工具列表</span>
        </button>
      </div>

      <div class="tool-grid mt-5" id="toolGrid"></div>

      <div class="tool-host mt-5" id="toolHost">
        <div class="tool-pane" data-pane="deriv"></div>
        <div class="tool-pane" data-pane="data"></div>
        <div class="tool-pane" data-pane="convert"></div>
        <div class="tool-pane" data-pane="calc"></div>
        <div class="tool-pane" data-pane="palette"></div>
        <div class="tool-pane" data-pane="timer"></div>
        <div class="tool-pane" data-pane="fourier"></div>
        <div class="tool-pane" data-pane="solid"></div>
        <div class="tool-pane" data-pane="prob"></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script type="module" src="assets/js/pages/tools.js"></script>
</body>
</html>
